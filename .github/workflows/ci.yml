name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=readonly"
      GONOSUMCHECK: ""

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module integrity
        run: go mod verify && (cd tools && go mod verify)

      - name: Install pre-commit (hash-locked)
        run: pip install --require-hashes -r .ci/requirements-precommit.txt

      # The guard reads workflows with PyYAML, installed hash-locked above.
      - name: Guard supply-chain invariants
        run: python3 scripts/check_workflows.py && python3 scripts/test_check_workflows.py

      - name: Pre-commit (format + hygiene)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --show-diff-on-failure --all-files

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint (staticcheck, modernize, gopls)
        run: scripts/lint.sh

      - name: Test
        run: go test ./...

      - name: Test the authority CA bundle's ownership checks as root
        run: |
          out="$(sudo env "PATH=$PATH" CGO_ENABLED=0 GOFLAGS=-mod=readonly \
            "GOMODCACHE=$(go env GOMODCACHE)" "GOCACHE=$(mktemp -d)" \
            go test ./internal/evidence/courier -run '^TestADirectoryOwnedByAnotherUserIsRefused$' -count=1 -v)"
          echo "$out"
          grep -q -- '--- PASS: TestADirectoryOwnedByAnotherUserIsRefused' <<<"$out"

  race:
    name: Race detector
    runs-on: ubuntu-latest

    # The race detector needs cgo. This job only runs tests and ships nothing;
    # every other job keeps cgo off (scripts/check_workflows.py).
    env:
      CGO_ENABLED: "1"
      GOFLAGS: "-mod=readonly"
      GONOSUMCHECK: ""

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module integrity
        run: go mod verify

      - name: Test with the race detector
        run: go test -race ./...
