name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: none

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-mod=readonly"
      GONOSUMCHECK: ""

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Guard supply-chain invariants
        run: python3 scripts/check_workflows.py

      - name: Verify module integrity
        run: go mod verify && (cd tools && go mod verify)

      - name: Install pre-commit (hash-locked)
        run: pip install --require-hashes -r .ci/requirements-precommit.txt

      - name: Pre-commit (format + hygiene)
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --show-diff-on-failure --all-files

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint (staticcheck, modernize, gopls)
        run: scripts/lint.sh

      - name: Test
        run: go test ./...
