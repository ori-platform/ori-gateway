# Pre-commit hooks for ori-gateway
#
# Install once: pre-commit install
# Run manually: pre-commit run --all-files

minimum_pre_commit_version: "3.7.0"
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: gofmt
        args: [-w]
        files: \.go$

      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        pass_filenames: false
        files: \.go$

      - id: license-header
        name: Apache-2.0 license header
        language: system
        entry: python3 scripts/check_license_headers.py
        pass_filenames: false
        files: \.go$

      - id: conventional-commit
        name: Conventional commit format
        language: python
        stages: [commit-msg]
        entry: python
        args:
          - -c
          - |-
            import re
            import sys

            msg = open(sys.argv[1]).read().split("\n")[0]
            pattern = (
                r"^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert|security)"
                r"(\([a-z0-9/-]+\))?: .{1,100}$"
            )
            if not re.match(pattern, msg):
                print("Commit message does not follow Conventional Commits format.")
                print(f"Got: {msg!r}")
                print("Expected: type(scope): description")
                sys.exit(1)
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
